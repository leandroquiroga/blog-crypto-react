<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/svg/icon-title.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4c1d95" />
    <meta
      name="description"
      content="Noticias, cotizaciones y portfolio personal de criptomonedas en tiempo real."
    />
    <link rel="apple-touch-icon" href="/assets/svg/icon-title.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Blog Crypto</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('crypto-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (error) {
          void error;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
